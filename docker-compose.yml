version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docbot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docbot
      POSTGRES_PASSWORD: docbot
      POSTGRES_DB: docbot
    volumes:
      - docbot-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docbot-redis
    ports:
      - "6379:6379"
    volumes:
      - docbot-redis-data:/data
    restart: unless-stopped

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=docbot
      - POSTGRES_USER=docbot
      - POSTGRES_PASSWORD=docbot
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres

  api:
    image: ${DOCKERHUB_USERNAME:-your_dockerhub_username}/docbot-api:latest
    container_name: docbot-api
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  docbot-postgres-data:
  docbot-redis-data:

